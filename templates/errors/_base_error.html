<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ code }} – Agaram Finance</title>
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; background:#f5f6f8; color:#1f2430;
           display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { text-align:center; padding:2rem; }
    .code { font-size:4rem; font-weight:700; color:#7c3aed; margin:0; }
    .msg  { font-size:1.1rem; margin:0.5rem 0 1.5rem; }
    a { color:#7c3aed; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">{{ code }}</p>
    <p class="msg">{{ message }}</p>
    <a href="/">Return to Agaram Finance</a>
  </div>
</body>
</html>
