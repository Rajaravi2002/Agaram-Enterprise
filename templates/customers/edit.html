{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title">Edit Customer</h1><p class="page-subtitle">{{ customer.name }}</p></div>
  <a href="{{ url_for('customers.view', cid=customer.id) }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-xl-8">
    <div class="card">
      <div class="card-header-custom"><h5><i class="bi bi-pencil me-2 text-primary-brand"></i>Update Customer</h5></div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('customers.edit', cid=customer.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Full Name *</label>
              <input type="text" name="name" class="form-control" value="{{ customer.name }}" required></div>
            <div class="col-md-6"><label class="form-label">Phone Number</label>
              <input type="tel" name="phone" class="form-control" value="{{ customer.phone or '' }}"></div>
            <div class="col-md-6"><label class="form-label">Alternate Phone</label>
              <input type="tel" name="alt_phone" class="form-control" value="{{ customer.alt_phone or '' }}"></div>
            <div class="col-md-6"><label class="form-label">Occupation</label>
              <input type="text" name="occupation" class="form-control" value="{{ customer.occupation or '' }}"></div>
            <div class="col-12"><label class="form-label">Address</label>
              <textarea name="address" class="form-control" rows="2">{{ customer.address or '' }}</textarea></div>
            <div class="col-md-6"><label class="form-label">Aadhaar Number</label>
              <input type="text" name="aadhaar" class="form-control" value="{{ customer.aadhaar or '' }}" maxlength="12"></div>
          </div>
          <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
            <a href="{{ url_for('customers.view', cid=customer.id) }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-2"></i>Update Customer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
