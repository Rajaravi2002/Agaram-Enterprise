{% extends "base.html" %}
{% block title %}Add Customer{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Add New Customer</h1>
    <p class="page-subtitle">Register a new borrower in the system</p>
  </div>
  <a href="{{ url_for('customers.index') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-xl-8">
    <div class="card">
      <div class="card-header-custom">
        <h5><i class="bi bi-person-plus me-2 text-primary-brand"></i>Customer Information</h5>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('customers.add') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" name="name" class="form-control"
                     value="{{ form_data.get('name','') }}" required placeholder="e.g. Rajesh Kumar">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number *</label>
              <input type="tel" name="phone" class="form-control"
                     value="{{ form_data.get('phone','') }}" required placeholder="10-digit mobile number"
                     pattern="[0-9]{10}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Alternate Phone</label>
              <input type="tel" name="alt_phone" class="form-control"
                     value="{{ form_data.get('alt_phone','') }}" placeholder="Optional">
            </div>
            <div class="col-md-6">
              <label class="form-label">Occupation</label>
              <input type="text" name="occupation" class="form-control"
                     value="{{ form_data.get('occupation','') }}" placeholder="e.g. Farmer, Shopkeeper">
            </div>
            <div class="col-12">
              <label class="form-label">Address *</label>
              <textarea name="address" class="form-control" rows="2" required
                        placeholder="Full address including city and pincode">{{ form_data.get('address','') }}</textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Aadhaar Number</label>
              <input type="text" name="aadhaar" class="form-control"
                     value="{{ form_data.get('aadhaar','') }}" placeholder="12-digit Aadhaar"
                     maxlength="12" pattern="[0-9]{12}">
            </div>
          </div>

          <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
            <a href="{{ url_for('customers.index') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="reset" class="btn btn-light">Reset</button>
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg me-2"></i>Save Customer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
