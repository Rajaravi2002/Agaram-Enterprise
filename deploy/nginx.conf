server {
    listen 80;
    server_name agaramfinance.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agaramfinance.example.com;

    ssl_certificate     /etc/letsencrypt/live/agaramfinance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agaramfinance.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /static/ {
        alias /opt/agaram_finance/static/;
        expires 30d;
    }
}

